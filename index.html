<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather + Time Widget</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root{
      --text:#fff;
      --muted:rgba(255,255,255,.66);
      --faint:rgba(255,255,255,.12);
      --glass:rgba(12,16,38,.38);
      --glass-strong:rgba(255,255,255,.08);
      --border:rgba(255,255,255,.16);
      --accent:#7cc4ff;
      --radius:22px;
      /* 안개 농도 (JS에서 강도별로 변경) */
      --fog-a1:.18; --fog-a2:.12;
    }
    /* 날씨별 포인트 컬러 */
    body.theme-clear-day  { --accent:#ffd166; }
    body.theme-clear-night{ --accent:#a5b8ff; }
    body.theme-cloudy     { --accent:#c3d3f5; }
    body.theme-rain       { --accent:#6ec3ff; }
    body.theme-snow       { --accent:#d8ecff; --glass:rgba(20,40,70,.40); }
    body.theme-fog        { --accent:#e6ebf2; --glass:rgba(30,40,60,.45); }
    body.theme-thunder    { --accent:#c79bff; }

    *{box-sizing:border-box}
    html,body{height:100%; margin:0}
    body{
      font-family:"Pretendard Variable",Pretendard,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      color:var(--text); background:#0b0f26; overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }

    /* ---------- 하늘 배경: 테마별 레이어를 겹쳐두고 크로스페이드 ---------- */
    .sky{position:fixed; inset:0; z-index:0; pointer-events:none}
    .sky > div{position:absolute; inset:0; opacity:0; transition:opacity 1.2s ease}
    .sky .clear-day  { background:
        radial-gradient(40% 50% at 85% 0%, rgba(255,236,170,.9), transparent 70%),
        linear-gradient(160deg,#4aa3e8 0%,#7cc6f2 45%,#f6d98a 100%); }
    .sky .clear-night{ background:
        radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 32% 8%,  #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 58% 22%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 76% 12%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 90% 30%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 44% 36%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 20% 42%, #fff 50%, transparent 51%),
        radial-gradient(90% 120% at 50% -20%, #2a3b63 0%, #0d1430 55%, #050816 100%); }
    .sky .cloudy     { background:linear-gradient(165deg,#5e6d8c 0%,#8f9bb5 50%,#c4ccdb 100%); }
    .sky .rain       { background:linear-gradient(180deg,#14232e 0%,#23404d 50%,#33586a 100%); }
    .sky .snow       { background:linear-gradient(180deg,#6d93b8 0%,#a9c7e3 55%,#dcebf8 100%); }
    .sky .fog        { background:linear-gradient(180deg,#8796ad 0%,#b4bfcf 50%,#dfe4eb 100%); }
    .sky .thunder    { background:radial-gradient(80% 60% at 50% 0%, #2b2350 0%, #121429 60%, #06070f 100%); }
    body.theme-clear-day   .sky .clear-day,
    body.theme-clear-night .sky .clear-night,
    body.theme-cloudy      .sky .cloudy,
    body.theme-rain        .sky .rain,
    body.theme-snow        .sky .snow,
    body.theme-fog         .sky .fog,
    body.theme-thunder     .sky .thunder{ opacity:1 }

    /* 비/눈 파티클 캔버스 */
    #fx{position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none}

    /* 안개 */
    #fog{position:fixed; inset:-10%; z-index:1; pointer-events:none; opacity:0; transition:opacity 1s}
    body.theme-fog #fog{opacity:1}
    #fog::before,#fog::after{
      content:""; position:absolute; inset:0; filter:blur(18px);
      background:
        radial-gradient(60% 30% at 20% 50%, rgba(255,255,255,var(--fog-a1)), transparent 65%),
        radial-gradient(50% 25% at 80% 60%, rgba(255,255,255,var(--fog-a2)), transparent 65%);
      animation:fogDrift 22s ease-in-out infinite alternate;
    }
    #fog::after{ transform:scaleX(-1); animation-duration:30s; animation-direction:alternate-reverse }
    @keyframes fogDrift{ from{translate:-5% 0} to{translate:5% 0} }

    /* 번개 */
    #flash{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0}
    body.theme-thunder #flash{animation:flash 8s linear infinite}
    @keyframes flash{
      0%,94%,100%{opacity:0}
      95%{opacity:1; background:radial-gradient(60% 45% at 50% 15%, rgba(220,210,255,.45), transparent 60%)}
      96%{opacity:.2}
      97%{opacity:.9; background:radial-gradient(30% 20% at 62% 22%, rgba(255,255,255,.55), transparent 60%)}
    }

    @media (prefers-reduced-motion: reduce){
      #fog::before,#fog::after,#flash,.icon-xxl{animation:none !important}
    }

    /* ---------- 카드 ---------- */
    .container{min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; z-index:2}
    .widget{
      width:min(1280px,96vw);
      display:grid; grid-template-columns:1.05fr .8fr 1.25fr; gap:20px 22px;
      grid-template-areas:"header header header" "main details forecast" "note note note";
      padding:22px 26px 18px; border-radius:var(--radius);
      background:var(--glass);
      -webkit-backdrop-filter:blur(22px) saturate(150%); backdrop-filter:blur(22px) saturate(150%);
      border:1px solid var(--border);
      box-shadow:0 20px 50px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.18);
      transition:background .8s ease;
    }
    @media (max-width:980px){
      .widget{grid-template-columns:1fr; grid-template-areas:"header" "main" "details" "forecast" "note"}
    }

    /* 헤더 */
    header{grid-area:header; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
    .place{display:flex; align-items:center; gap:10px; min-width:0; margin-right:auto}
    .place svg{flex:none; color:var(--accent)}
    #place{font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    #tz{font-size:12px; color:var(--muted); padding:4px 10px; border-radius:999px; border:1px solid var(--faint); white-space:nowrap}

    .search{
      display:flex; align-items:center; gap:4px; flex:0 1 380px; min-width:240px;
      background:rgba(0,0,0,.22); border:1px solid var(--faint); border-radius:999px; padding:4px 4px 4px 14px;
      transition:border-color .2s, box-shadow .2s;
    }
    .search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent)}
    .search input{flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text); font:inherit; font-size:14px; padding:6px 0}
    .search input::placeholder{color:var(--muted)}
    .search input::-webkit-search-cancel-button{filter:invert(1); opacity:.6}

    .icon-btn{
      display:grid; place-items:center; width:34px; height:34px; border-radius:50%;
      border:0; background:transparent; color:var(--text); cursor:pointer; transition:background .2s, transform .1s;
    }
    .icon-btn:hover{background:var(--glass-strong)}
    .icon-btn:active{transform:scale(.92)}
    .icon-btn.primary{background:var(--accent); color:#0b1430}
    .icon-btn.primary:hover{filter:brightness(1.08)}

    .units{position:relative; display:flex; padding:3px; border-radius:999px; background:rgba(0,0,0,.22); border:1px solid var(--faint)}
    .units button{
      position:relative; z-index:1; width:42px; height:30px; border:0; border-radius:999px; background:none;
      color:var(--muted); font:inherit; font-weight:700; font-size:13px; cursor:pointer; transition:color .25s;
    }
    .units button.active{color:#0b1430}
    .units .thumb{position:absolute; top:3px; left:3px; width:42px; height:30px; border-radius:999px; background:var(--accent); transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
    .units.f .thumb{transform:translateX(42px)}

    /* 메인 */
    .main{grid-area:main; display:flex; flex-direction:column; justify-content:center; gap:14px}
    .now{display:flex; align-items:center; gap:16px}
    .icon-xxl{width:124px; height:124px; margin:-10px -6px -10px -10px; flex:none; filter:drop-shadow(0 10px 18px rgba(0,0,0,.28)); animation:float 6s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-6px)}}

    /* ---------- SVG 날씨 아이콘 ---------- */
    .wx{display:block; width:100%; height:100%; overflow:visible}
    .wx .sun-core{fill:#ffc94d}
    .wx .sun-ray{stroke:#ffc94d; stroke-width:3; stroke-linecap:round}
    .wx .moon{fill:#e9edff}
    .wx .star{fill:#fff}
    .wx .c-front{fill:#f5f8fc}
    .wx .c-back{fill:#c5cfe0}
    .wx .c-dark{fill:#a3aec2}
    .wx .c-storm{fill:#7d879c}
    .wx .drop{stroke:#7cc4ff; stroke-width:2.6; stroke-linecap:round}
    .wx .flake{fill:#fff}
    .wx .bolt{fill:#ffd54a}
    .wx .mist{stroke:#e8edf4; stroke-width:3; stroke-linecap:round}

    .wx .spin{animation:wxSpin 18s linear infinite}
    .wx .pulse{transform-box:fill-box; transform-origin:center; animation:wxPulse 4s ease-in-out infinite}
    .wx .drift{animation:wxDrift 6s ease-in-out infinite}
    .wx .drift.slow{animation-duration:9s; animation-direction:reverse}
    .wx .drop{animation:wxRain 1s linear infinite}
    .wx .drop.dz{animation-duration:1.6s}
    .wx .flake{animation:wxSnow 2.6s linear infinite}
    .wx .bolt{animation:wxBolt 3s steps(1) infinite}
    .wx .mist{animation:wxMist 4s ease-in-out infinite alternate}
    .wx .star{transform-box:fill-box; transform-origin:center; animation:wxTwinkle 3s ease-in-out infinite}
    @keyframes wxSpin{to{transform:rotate(360deg)}}
    @keyframes wxPulse{50%{transform:scale(1.06)}}
    @keyframes wxDrift{50%{transform:translateX(2.5px)}}
    @keyframes wxRain{0%{transform:translate(0,-4px); opacity:0} 20%{opacity:1} 100%{transform:translate(-3px,9px); opacity:0}}
    @keyframes wxSnow{0%{transform:translate(0,-3px); opacity:0} 20%{opacity:1} 50%{transform:translate(1.5px,4px)} 100%{transform:translate(-1px,11px); opacity:0}}
    @keyframes wxBolt{0%,100%{opacity:1} 8%{opacity:.2} 12%{opacity:1} 16%{opacity:.3} 20%{opacity:1}}
    @keyframes wxMist{from{transform:translateX(-3px)} to{transform:translateX(3px)}}
    @keyframes wxTwinkle{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.3; transform:scale(.6)}}
    @media (prefers-reduced-motion: reduce){ .wx *{animation:none !important} }
    .temp{font-size:84px; font-weight:200; letter-spacing:-4px; line-height:.95; font-variant-numeric:tabular-nums}
    .temp sup{font-size:.36em; font-weight:400; letter-spacing:0; vertical-align:top; position:relative; top:.35em; margin-left:4px; color:var(--muted)}
    .cond{font-size:16px; font-weight:600; margin-top:6px}
    .cond small{font-weight:400; color:var(--muted); margin-left:6px}

    .clock{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding-top:14px; border-top:1px solid var(--faint); font-variant-numeric:tabular-nums}
    .clock .time{font-size:34px; font-weight:700; letter-spacing:-.5px}
    .clock .sec{font-size:18px; font-weight:500; color:var(--muted); margin-left:2px}
    .clock .date{font-size:14px; color:var(--muted)}

    /* 상세 */
    .details{grid-area:details; display:grid; grid-template-columns:repeat(2,1fr); gap:12px; align-content:center}
    .tile{background:var(--glass-strong); border:1px solid var(--faint); padding:14px; border-radius:16px; display:flex; flex-direction:column; gap:8px; min-height:96px}
    .tile .label{display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; font-weight:600; letter-spacing:.02em}
    .tile .label svg{opacity:.85}
    .tile .value{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:8px}
    .tile .value .sub{font-size:14px; color:var(--muted); font-weight:500}
    .meter{height:5px; border-radius:99px; background:var(--faint); overflow:hidden; margin-top:auto}
    .meter i{display:block; height:100%; width:0; border-radius:inherit; background:var(--accent); transition:width .8s ease}
    #windArrow{display:inline-block; transition:transform .8s ease; color:var(--accent)}

    /* 예보 */
    .forecast{grid-area:forecast; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; align-content:center}
    .day{
      background:var(--glass-strong); border:1px solid var(--faint); border-radius:16px; padding:14px 12px;
      display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;
      transition:transform .2s, background .2s;
    }
    .day:hover{transform:translateY(-3px); background:rgba(255,255,255,.12)}
    .day .d{font-size:13px; font-weight:600}
    .day .d span{color:var(--muted); font-weight:400; margin-left:4px}
    .day .i{width:64px; height:64px; margin:-4px 0; filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
    .day .p{font-size:12px; color:#9fd3ff; min-height:16px; display:flex; align-items:center; gap:3px}
    .day .t{display:flex; justify-content:space-between; width:100%; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums}
    .day .t .lo{color:var(--muted); font-weight:500}
    .range{position:relative; width:100%; height:5px; border-radius:99px; background:var(--faint)}
    .range i{position:absolute; top:0; bottom:0; border-radius:inherit; background:linear-gradient(90deg,#7cc4ff,var(--accent),#ff9f6e)}

    .note{grid-area:note; display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:12px; padding-top:4px}
    .error{color:#ffb4b4}

    /* 로딩 스켈레톤 */
    .loading .temp, .loading .tile .value, .loading .clock .time{
      color:transparent; border-radius:8px;
      background:linear-gradient(90deg, var(--faint) 0%, rgba(255,255,255,.22) 50%, var(--faint) 100%) 0 0/200% 100%;
      animation:shimmer 1.4s linear infinite;
    }
    .loading .temp sup{opacity:0}
    @keyframes shimmer{to{background-position:-200% 0}}
  </style>
</head>
<body class="theme-clear-night">
  <div class="sky" aria-hidden="true">
    <div class="clear-day"></div><div class="clear-night"></div><div class="cloudy"></div>
    <div class="rain"></div><div class="snow"></div><div class="fog"></div><div class="thunder"></div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="fog" aria-hidden="true"></div>
  <div id="flash" aria-hidden="true"></div>

  <div class="container">
    <main class="widget loading" id="app">
      <header>
        <div class="place">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
          <span id="place">위치 확인 중…</span>
          <span id="tz" title="Time Zone"></span>
        </div>
        <div class="search">
          <input id="q" type="search" placeholder="도시 검색 (Seoul, Tokyo…)" aria-label="도시 검색" />
          <button id="btnGeo" class="icon-btn" title="내 위치" aria-label="내 위치">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          </button>
          <button id="btnSearch" class="icon-btn primary" title="검색" aria-label="검색">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
        </div>
        <div class="units" id="units" role="group" aria-label="온도 단위">
          <span class="thumb"></span>
          <button id="btnC" class="active">°C</button>
          <button id="btnF">°F</button>
        </div>
      </header>

      <section class="main">
        <div class="now">
          <div class="icon-xxl" id="icon" role="img" aria-label="날씨"></div>
          <div>
            <div class="temp" id="temp">--</div>
            <div class="cond" id="cond">-</div>
          </div>
        </div>
        <div class="clock" id="clock"><span class="time">--:--</span><span class="date"></span></div>
      </section>

      <section class="details">
        <div class="tile">
          <div class="label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0Z"/></svg>체감</div>
          <div class="value" id="feels">--</div>
        </div>
        <div class="tile">
          <div class="label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 16h15a3 3 0 1 1-3 3M3 12h8"/></svg>바람</div>
          <div class="value"><span id="wind">--</span><span id="windArrow" title="바람 방향">↓</span></div>
        </div>
        <div class="tile">
          <div class="label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.7s6 6.3 6 11.3a6 6 0 0 1-12 0c0-5 6-11.3 6-11.3Z"/></svg>습도</div>
          <div class="value" id="rh">--</div>
          <div class="meter"><i id="rhBar"></i></div>
        </div>
        <div class="tile">
          <div class="label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 4v16M8 4 4 8M8 4l4 4M16 20V4M16 20l-4-4M16 20l4-4"/></svg>오늘 최고 / 최저</div>
          <div class="value"><span id="tmax">--</span><span class="sub">/ <span id="tmin">--</span></span></div>
        </div>
      </section>

      <section class="forecast" id="forecast"></section>

      <footer class="note">
        <span>야근하지말고 칼퇴 ㄱ</span>
        <span class="error" id="err"></span>
      </footer>
    </main>
  </div>

  <script>
    // ---------- Helpers ----------
    const $ = s => document.querySelector(s);
    const state = { lat:null, lon:null, placeText:"", units:"C", tz:null, clockTimer:null, raw:null };
    const cToF = c => c*9/5+32;
    const tNum = vC => (vC==null||Number.isNaN(vC)) ? null : Math.round(state.units==="C"?vC:cToF(vC));
    const fmtTemp = vC => { const n=tNum(vC); return n==null ? "--" : n + "°"; };
    const fmtSpeed = ms => (ms==null||Number.isNaN(ms)) ? "--" : ms.toFixed(1) + " m/s";
    const fmtPct = p => (p!=null) ? Math.round(p) + "%" : "--";

    // ---------- 애니메이션 SVG 날씨 아이콘 (64×64 기준) ----------
    const WX = (() => {
      const CLOUD = "M20 46a9 9 0 0 1-.5-17.98A13 13 0 0 1 44.5 25.5 10.25 10.25 0 0 1 46 46Z";
      const cloud = (cls, x=0, y=0, s=1, drift="drift") =>
        `<g class="${drift}"><path class="${cls}" transform="translate(${x} ${y}) scale(${s})" d="${CLOUD}"/></g>`;
      const sun = (cx, cy, r) => {
        const rays = Array.from({length:8}, (_,i) => {
          const a = i*Math.PI/4, r1 = r+4, r2 = r+8;
          return `<line class="sun-ray" x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*r2).toFixed(1)}" y2="${(cy+Math.sin(a)*r2).toFixed(1)}"/>`;
        }).join("");
        return `<g class="spin" style="transform-origin:${cx}px ${cy}px">${rays}</g><circle class="sun-core pulse" cx="${cx}" cy="${cy}" r="${r}"/>`;
      };
      const moon = (cx, cy, r, stars=true) => {
        const x = cx + r*.5, y1 = cy - r*.866, y2 = cy + r*.866;
        const m = `<path class="moon" d="M${x} ${y1}A${r} ${r} 0 1 0 ${x} ${y2}A${r*.95} ${r*.95} 0 0 1 ${x} ${y1}Z"/>`;
        const s = stars ? `<circle class="star" cx="${cx+r+6}" cy="${cy-r+2}" r="1.6"/><circle class="star" style="animation-delay:-1.4s" cx="${cx+r+2}" cy="${cy+4}" r="1.1"/>` : "";
        return m + s;
      };
      const drops = (xs, cls="drop", y=50, len=7) => xs.map((x,i) =>
        `<line class="${cls}" style="animation-delay:${(-i*0.33).toFixed(2)}s" x1="${x}" y1="${y}" x2="${x-2}" y2="${y+len}"/>`).join("");
      const flakes = (xs, y=52) => xs.map((x,i) =>
        `<circle class="flake" style="animation-delay:${(-i*0.65).toFixed(2)}s" cx="${x}" cy="${y}" r="2.2"/>`).join("");
      const wrap = inner => `<svg class="wx" viewBox="0 0 64 64" aria-hidden="true">${inner}</svg>`;

      const icons = {
        "clear-day":    () => sun(32, 32, 12),
        "clear-night":  () => moon(30, 32, 15),
        "partly-day":   () => sun(23, 23, 9) + cloud("c-front", 4, 6, .92),
        "partly-night": () => moon(22, 22, 10, false) + cloud("c-front", 4, 6, .92),
        "cloudy":       () => cloud("c-back", 10, -6, .8, "drift slow") + cloud("c-front", 0, 4),
        "fog":          () => cloud("c-back", 2, -6) +
                              `<line class="mist" x1="12" y1="46" x2="46" y2="46"/><line class="mist" style="animation-delay:-1.5s" x1="18" y1="53" x2="52" y2="53"/><line class="mist" style="animation-delay:-3s" x1="14" y1="60" x2="40" y2="60"/>`,
        "drizzle":      () => cloud("c-dark", 0, -4) + drops([24, 34, 44], "drop dz", 46, 4),
        "rain":         () => cloud("c-dark", 0, -4) + drops([22, 30, 38, 46], "drop", 46, 7),
        "showers":      () => sun(42, 18, 8) + cloud("c-dark", -2, 0, .92) + drops([22, 32, 42], "drop", 48, 6),
        "sleet":        () => cloud("c-dark", 0, -4) + drops([22, 38], "drop", 46, 6) + flakes([30, 46], 48),
        "snow":         () => cloud("c-front", 0, -4) + flakes([22, 32, 42, 27, 37], 48),
        "thunder":      () => cloud("c-storm", 0, -4) +
                              `<path class="bolt" d="M34 40 26 52h7l-3 10 10-14h-7l4-8Z"/>` + drops([20, 46], "drop", 46, 6),
      };
      return kind => wrap((icons[kind] || icons.cloudy)());
    })();

    function iconFor(code,isDay=true){
      const k = (day, night) => WX(isDay ? day : night);
      if (code===0) return {icon:k("clear-day","clear-night"), label:"맑음"};
      if (code===1) return {icon:k("partly-day","partly-night"), label:"대체로 맑음"};
      if (code===2) return {icon:k("partly-day","partly-night"), label:"구름 조금"};
      if (code===3) return {icon:WX("cloudy"), label:"흐림"};
      if ([45,48].includes(code)) return {icon:WX("fog"), label:"안개"};
      if ([51,53,55].includes(code)) return {icon:WX("drizzle"), label:"이슬비"};
      if ([56,57,66,67].includes(code)) return {icon:WX("sleet"), label:"어는 비"};
      if ([61,63,65].includes(code)) return {icon:WX("rain"), label:"비"};
      if ([80,81,82].includes(code)) return {icon:k("showers","rain"), label:"소나기"};
      if ([71,73,75,77,85,86].includes(code)) return {icon:WX("snow"), label:"눈"};
      if ([95,96,99].includes(code)) return {icon:WX("thunder"), label:"뇌우"};
      return {icon:WX("cloudy"), label:"흐림"};
    }

    function themeFor(code,isDay){
      if ([0,1].includes(code)) return isDay ? "clear-day" : "clear-night";
      if ([2,3].includes(code)) return "cloudy";
      if ([45,48].includes(code)) return "fog";
      if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return "rain";
      if ([71,73,75,77,85,86].includes(code)) return "snow";
      if ([95,96,99].includes(code)) return "thunder";
      return "cloudy";
    }

    // 날씨 코드 → 효과 종류/강도
    function effectFromCode(code){
      const map = {
        51:['rain','light'],56:['rain','light'],53:['rain','moderate'],57:['rain','moderate'],55:['rain','heavy'],
        61:['rain','light'],63:['rain','moderate'],65:['rain','heavy'],
        80:['rain','light'],81:['rain','moderate'],82:['rain','heavy'],
        66:['rain','moderate'],67:['rain','heavy'],
        71:['snow','light'],73:['snow','moderate'],75:['snow','heavy'],77:['snow','moderate'],85:['snow','light'],86:['snow','heavy'],
        45:['fog','moderate'],48:['fog','heavy'],
        95:['rain','heavy'],96:['rain','heavy'],99:['rain','heavy'] // 뇌우엔 폭우도 같이
      };
      const m = map[code]; return m ? {type:m[0], level:m[1]} : {type:null, level:'light'};
    }

    // ---------- 비/눈 파티클 (canvas) ----------
    const FX = (() => {
      const cv = $("#fx"), ctx = cv.getContext("2d");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const CFG = {
        rain:{ light:{n:90, v:13, len:12, w:1,   a:.28}, moderate:{n:180, v:17, len:17, w:1.2, a:.36}, heavy:{n:340, v:23, len:24, w:1.5, a:.45} },
        snow:{ light:{n:60, v:.6, r:[.8,2.2], a:.75},    moderate:{n:140, v:.9, r:[1,2.8], a:.85},      heavy:{n:260, v:1.4, r:[1.2,3.4], a:.95} }
      };
      let W=0,H=0, parts=[], cfg=null, type=null, wind=0, raf=null;
      const rnd=(a,b)=>a+Math.random()*(b-a);
      function resize(){
        const dpr=Math.min(devicePixelRatio||1,2);
        W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      }
      function spawn(p, initial){
        p.x=rnd(-W*.2, W*1.1); p.y=initial?rnd(-H,H):rnd(-H*.3,-10);
        if(type==='rain'){ p.v=cfg.v*rnd(.8,1.2); p.len=cfg.len*rnd(.7,1.2); }
        else { p.r=rnd(...cfg.r); p.v=cfg.v*rnd(.6,1.3)*(p.r/2); p.ph=rnd(0,Math.PI*2); }
        return p;
      }
      function frame(){
        ctx.clearRect(0,0,W,H);
        if(type==='rain'){
          const dx = wind*.35; // 바람에 따라 기울기
          ctx.strokeStyle=`rgba(210,230,255,${cfg.a})`; ctx.lineWidth=cfg.w; ctx.lineCap="round";
          ctx.beginPath();
          for(const p of parts){
            const k=p.len/p.v;
            ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+dx*k, p.y+p.len);
            p.x+=dx; p.y+=p.v;
            if(p.y>H) spawn(p,false);
          }
          ctx.stroke();
        }else if(type==='snow'){
          ctx.fillStyle=`rgba(255,255,255,${cfg.a})`;
          for(const p of parts){
            p.ph+=.015;
            p.x+=Math.sin(p.ph)*.5 + wind*.06; p.y+=p.v;
            ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
            if(p.y>H+5) spawn(p,false);
          }
        }
        if(!reduce) raf=requestAnimationFrame(frame);
      }
      function set(t, level, windMs=0){
        cancelAnimationFrame(raf); type=null; ctx.clearRect(0,0,W,H);
        if(t!=='rain' && t!=='snow') return;
        type=t; cfg=CFG[t][level]; wind=Math.min(windMs,15);
        parts=Array.from({length: Math.round(cfg.n * Math.min(1, W/1400 + .3))}, ()=>spawn({},true));
        frame();
      }
      addEventListener("resize", ()=>{ resize(); if(type) set(type, Object.keys(CFG[type]).find(k=>CFG[type][k]===cfg), wind); });
      resize();
      return {set};
    })();

    function applyEffects(theme, code, windMs){
      const b=document.body;
      [...b.classList].filter(c=>c.startsWith("theme-")).forEach(c=>b.classList.remove(c));
      b.classList.add("theme-"+theme);
      const eff = effectFromCode(code);
      FX.set(eff.type, eff.level, windMs);
      if(eff.type==='fog'){
        const lv = {light:['.10','.06'], moderate:['.18','.12'], heavy:['.28','.18']}[eff.level];
        document.documentElement.style.setProperty('--fog-a1',lv[0]);
        document.documentElement.style.setProperty('--fog-a2',lv[1]);
      }
    }

    const setError = msg => $("#err").textContent = msg || "";

    // ---------- Clock ----------
    function startClock(){
      clearInterval(state.clockTimer);
      const tz = state.tz || Intl.DateTimeFormat().resolvedOptions().timeZone;
      const fTime = new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:tz});
      const fDate = new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long',timeZone:tz});
      const el = $("#clock");
      const tick = () => {
        const now=new Date();
        const p=Object.fromEntries(fTime.formatToParts(now).map(x=>[x.type,x.value]));
        el.innerHTML = `<span class="time">${p.hour}:${p.minute}<span class="sec">${p.second}</span></span><span class="date">${fDate.format(now)}</span>`;
      };
      tick(); state.clockTimer=setInterval(tick,1000);
    }

    // ---------- Render ----------
    function render(){
      const d = state.raw; if(!d) return;
      const cur=d.current, daily=d.daily;
      const isDay = cur.is_day===1;
      const ic = iconFor(cur.weather_code, isDay);

      $("#app").classList.remove("loading");
      $("#icon").innerHTML = ic.icon;
      $("#icon").setAttribute("aria-label", ic.label);
      const t = tNum(cur.temperature_2m);
      $("#temp").innerHTML = `${t ?? "--"}<sup>°${state.units}</sup>`;
      $("#cond").innerHTML = `${ic.label}<small>체감 ${fmtTemp(cur.apparent_temperature)}</small>`;

      $("#feels").textContent = fmtTemp(cur.apparent_temperature);
      $("#wind").textContent = fmtSpeed(cur.wind_speed_10m);
      // 바람이 불어오는 방향 → 불어가는 방향으로 화살표 회전
      if (cur.wind_direction_10m!=null) $("#windArrow").style.transform = `rotate(${cur.wind_direction_10m}deg)`;
      $("#rh").textContent = fmtPct(cur.relative_humidity_2m);
      $("#rhBar").style.width = (cur.relative_humidity_2m ?? 0) + "%";

      $("#place").textContent = state.placeText;
      $("#tz").textContent = (state.tz||"").replaceAll("_"," ");

      if (daily?.time?.length){
        $("#tmax").textContent = fmtTemp(daily.temperature_2m_max[0]);
        $("#tmin").textContent = fmtTemp(daily.temperature_2m_min[0]);
      }

      // 3일 예보 + 온도 범위 막대
      const fcEl=$("#forecast"); fcEl.innerHTML="";
      const count=Math.min(3,(daily?.time?.length||1)-1);
      const lows=daily.temperature_2m_min.slice(1,count+1), highs=daily.temperature_2m_max.slice(1,count+1);
      const gMin=Math.min(...lows), gMax=Math.max(...highs), span=Math.max(1,gMax-gMin);
      for(let i=1;i<=count;i++){
        const dd=iconFor(daily.weather_code[i],true);
        const date=new Date(daily.time[i]+"T12:00:00");
        const wd=date.toLocaleDateString('ko-KR',{weekday:'short'});
        const md=date.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});
        const lo=daily.temperature_2m_min[i], hi=daily.temperature_2m_max[i];
        const pop=daily.precipitation_probability_max?.[i];
        const left=(lo-gMin)/span*100, width=Math.max(8,(hi-lo)/span*100);
        const node=document.createElement("div");
        node.className="day"; node.title=dd.label;
        node.innerHTML=`
          <div class="d">${wd}<span>${md}</span></div>
          <div class="i">${dd.icon}</div>
          <div class="p">${pop>0 ? `<svg width="10" height="12" viewBox="0 0 24 28" fill="currentColor"><path d="M12 1s10 11 10 17a10 10 0 0 1-20 0C2 12 12 1 12 1Z"/></svg>${pop}%` : ""}</div>
          <div class="range"><i style="left:${left}%;width:${Math.min(width,100-left)}%"></i></div>
          <div class="t"><span class="lo">${fmtTemp(lo)}</span><span>${fmtTemp(hi)}</span></div>`;
        fcEl.appendChild(node);
      }

      applyEffects(themeFor(cur.weather_code,isDay), cur.weather_code, cur.wind_speed_10m);
    }

    // ---------- Data ----------
    async function geocode(name){
      const url=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=ko&format=json`;
      const r=await fetch(url); if(!r.ok) throw new Error("지오코딩 실패");
      const j=await r.json(); if(!j.results?.length) throw new Error("검색 결과가 없어요");
      const g=j.results[0];
      return {lat:g.latitude, lon:g.longitude, place:[g.name,g.admin1,g.country_code].filter(Boolean).join(", "), tz:g.timezone||null};
    }
    async function fetchWeather(lat,lon){
      const url=new URL("https://api.open-meteo.com/v1/forecast");
      const params={
        latitude:lat, longitude:lon,
        current:"temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,is_day",
        daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
        wind_speed_unit:"ms", timezone:"auto", forecast_days:4
      };
      Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
      const r=await fetch(url); if(!r.ok) throw new Error("날씨 API 실패");
      return r.json();
    }
    async function load(lat,lon,place,tzHint){
      state.lat=lat; state.lon=lon; state.placeText=place;
      const data=await fetchWeather(lat,lon);
      state.tz=data.timezone||tzHint||Intl.DateTimeFormat().resolvedOptions().timeZone;
      state.raw=data; render(); startClock();
    }
    async function loadByQuery(q){
      setError("");
      try{ const g=await geocode(q); await load(g.lat,g.lon,g.place,g.tz); }
      catch(e){ console.error(e); setError(e.message||"검색 중 오류가 발생했어요."); }
    }
    async function loadByCoords(lat,lon,labelHint){
      setError("");
      try{
        let place=labelHint||"";
        try{
          const r=await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=ko&format=json`);
          if(r.ok){ const g=(await r.json())?.results?.[0]; if(g) place=[g.name,g.admin1,g.country_code].filter(Boolean).join(", "); }
        }catch(_){}
        await load(lat,lon,place||`${lat.toFixed(2)}, ${lon.toFixed(2)}`);
      }catch(e){ console.error(e); setError("현재 위치의 날씨를 불러오지 못했어요."); }
    }

    // ---------- Events ----------
    const doSearch=()=>{ const q=$("#q").value.trim(); if(q) loadByQuery(q); };
    $("#btnSearch").addEventListener("click", doSearch);
    $("#q").addEventListener("keydown", e=>{ if(e.key==="Enter") doSearch(); });
    $("#btnGeo").addEventListener("click", ()=>{
      if(!navigator.geolocation){ setError("브라우저가 위치 기능을 지원하지 않아요."); return; }
      navigator.geolocation.getCurrentPosition(
        pos=>loadByCoords(pos.coords.latitude,pos.coords.longitude,"내 위치"),
        err=>setError("위치 권한 거부 또는 오류: "+err.message),
        {enableHighAccuracy:true, maximumAge:300000, timeout:10000});
    });
    function setUnits(u){
      state.units=u;
      $("#btnC").classList.toggle("active",u==="C"); $("#btnF").classList.toggle("active",u==="F");
      $("#units").classList.toggle("f",u==="F"); render();
    }
    $("#btnC").addEventListener("click",()=>setUnits("C"));
    $("#btnF").addEventListener("click",()=>setUnits("F"));

    // ---------- Init ----------
    const DEFAULT=[37.382,126.640,"인천 송도"];
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        pos=>loadByCoords(pos.coords.latitude,pos.coords.longitude,"내 위치"),
        ()=>loadByCoords(...DEFAULT),
        {enableHighAccuracy:true, maximumAge:300000, timeout:10000});
    } else loadByCoords(...DEFAULT);
  </script>
</body>
</html>
